server:
  port: 8082

spring:
  application:
    name: config-service

  # H2 in-memory database for dev
  datasource:
    url: jdbc:h2:mem:configdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    com.ratelimiter.configservice: DEBUG
